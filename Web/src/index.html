<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nudo · Ordena tus gastos con el SRI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nudo: ordena los gastos del mes con tus facturas del SRI (reporte .txt o XML), verificadas una por una.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema antes de pintar para evitar el parpadeo claro/oscuro.
    try {
      var tema = localStorage.getItem('tema');
      if (tema !== 'light' && tema !== 'dark') {
        tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
