<div class="min-h-dvh lg:flex">
  <!-- Fondo del menú en móvil -->
  @if (menuAbierto()) {
    <div class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="menuAbierto.set(false)" aria-hidden="true"></div>
  }

  <!-- Menú lateral -->
  <aside
    id="menu-lateral"
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-border bg-bg-2 transition-transform duration-200 lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"
    [class.-translate-x-full]="!menuAbierto()"
    aria-label="Navegación principal"
  >
    <div class="flex h-16 items-center justify-between gap-2 px-5">
      <a routerLink="/resumen" class="rounded-md" aria-label="Nudo, ir al panel de gastos">
        <app-marca [tamano]="28" />
      </a>
      <button type="button" class="btn btn-ghost -mr-2 px-2 lg:hidden" aria-label="Cerrar menú" (click)="menuAbierto.set(false)">
        <svg lucideX class="size-5" aria-hidden="true"></svg>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 pb-4">
      <p class="px-3 pb-4 pt-5 text-[10px] font-semibold uppercase tracking-[0.18em] text-muted-fg">Gestión de gastos</p>
      <ul class="space-y-1">
        <li><a routerLink="/resumen" routerLinkActive="nav-activo" class="nav-item"><svg lucideLayoutDashboard class="size-5" aria-hidden="true"></svg> Panel general</a></li>
        <li>
          <a routerLink="/importar" routerLinkActive="nav-activo" class="nav-item">
            <svg lucideFileUp class="size-5" aria-hidden="true"></svg> Importar del SRI
          </a>
        </li>
        <li>
          <a routerLink="/gastos" routerLinkActive="nav-activo" class="nav-item">
            <svg lucideReceipt class="size-5" aria-hidden="true"></svg> Mis facturas
          </a>
        </li>
        <li>
          <a routerLink="/presupuesto" routerLinkActive="nav-activo" class="nav-item">
            <svg lucideWallet class="size-5" aria-hidden="true"></svg> Presupuesto
          </a>
        </li>
        <li>
          <a routerLink="/proveedores" routerLinkActive="nav-activo" class="nav-item">
            <svg lucideStore class="size-5" aria-hidden="true"></svg> Proveedores
          </a>
        </li>
      </ul>

    </nav>

    <!-- Menú de la cuenta: perfil, configuración del sistema y salida -->
    <div class="relative border-t border-border p-3" #menuCuenta (keydown)="teclaMenu($event)">
      @if (menuUsuario()) {
        <div id="menu-usuario" role="menu" aria-label="Tu cuenta"
          class="absolute inset-x-3 bottom-full z-50 mb-2 overflow-hidden rounded-xl border border-border bg-card p-1.5 shadow-dashboard">
          <div class="px-3 pt-2 pb-2.5">
            <p class="truncate text-sm font-semibold">{{ nombre() }}</p>
            <p class="truncate text-xs text-muted-fg">{{ auth.usuario()?.email }}</p>
          </div>
          <div class="my-1 h-px bg-border" role="separator"></div>
          <a routerLink="/perfil" routerLinkActive="nav-activo" role="menuitem" class="nav-item">
            <svg lucideUserPen class="size-5" aria-hidden="true"></svg>
            <span class="flex-1">Editar perfil</span>
            @if (!perfil.completo()) {
              <span class="size-2 shrink-0 rounded-full bg-warning" title="Perfil incompleto" aria-hidden="true"></span>
              <span class="sr-only">(incompleto)</span>
            }
          </a>
          <a routerLink="/configuracion" routerLinkActive="nav-activo" role="menuitem" class="nav-item">
            <svg lucideSettings class="size-5" aria-hidden="true"></svg> Configuración
          </a>
          <div class="my-1 h-px bg-border" role="separator"></div>
          <button type="button" role="menuitem" class="nav-item w-full hover:bg-danger-soft hover:text-danger" (click)="auth.cerrarSesion()">
            <svg lucideLogOut class="size-5" aria-hidden="true"></svg> Cerrar sesión
          </button>
        </div>
      }
      <button #botonCuenta type="button"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition-colors hover:bg-muted"
        [class.bg-muted]="menuUsuario()"
        aria-haspopup="menu" aria-controls="menu-usuario" [attr.aria-expanded]="menuUsuario()"
        (click)="alternarMenuUsuario()">
        <span class="relative grid size-9 shrink-0 place-items-center rounded-full bg-primary-soft text-sm font-semibold text-primary" aria-hidden="true">
          {{ iniciales() }}
          @if (!perfil.completo()) {
            <span class="absolute -top-0.5 -right-0.5 size-2.5 rounded-full bg-warning ring-2 ring-bg-2"></span>
          }
        </span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium">{{ nombre() }}</span>
          <span class="block truncate text-xs text-muted-fg">{{ auth.usuario()?.email }}</span>
        </span>
        <svg lucideChevronsUpDown class="size-4 shrink-0 text-muted-fg" aria-hidden="true"></svg>
        <span class="sr-only">Abrir el menú de tu cuenta{{ perfil.completo() ? '' : ' (perfil incompleto)' }}</span>
      </button>
    </div>
    <app-credito class="block px-6 pb-4" />
  </aside>

  <!-- Contenido -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-border bg-bg/90 px-4 backdrop-blur sm:px-6">
      <button
        type="button"
        class="btn btn-ghost -ml-2 px-2 lg:hidden"
        aria-label="Abrir menú"
        aria-controls="menu-lateral"
        [attr.aria-expanded]="menuAbierto()"
        (click)="menuAbierto.set(true)"
      >
        <svg lucideMenu class="size-5" aria-hidden="true"></svg>
      </button>

      <div class="flex items-center gap-2 text-sm font-medium"><span class="hidden sm:inline">Período</span><app-selector-periodo /></div>

      <div class="ml-auto">
        <button
          type="button"
          class="btn btn-ghost px-2"
          [attr.aria-label]="preferencias.tema() === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'"
          (click)="preferencias.alternarTema()"
        >
          @if (preferencias.tema() === 'dark') {
            <svg lucideSun class="size-5" aria-hidden="true"></svg>
          } @else {
            <svg lucideMoon class="size-5" aria-hidden="true"></svg>
          }
        </button>
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 sm:py-8">
      <router-outlet />
    </main>
  </div>
</div>

<app-avisos />
